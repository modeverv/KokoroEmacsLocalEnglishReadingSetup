<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>my-read ローカルHTMLの読書</title></head>
<body>
<h1>ローカルHTMLをEWWで読む</h1>
<p>保存したHTMLファイルも、Webページとして読むことができます。</p>
<p>見出しやリンクはEWWでレンダリングされ、日本語の読み上げにも対応します。</p>
<h2>読書位置を保存する</h2>
<p>読み上げ中の位置と表示位置を自動的に記録します。</p>
<p>同じHTMLを開き直すと、レンダリング後に前回の場所へ戻ります。</p>
<h2>ページを閉じる</h2>
<p>EWWの本文で C-x C-k を押すと、ページを閉じてDIREDへ戻ります。</p>
<p>my-readのフレームはそのまま残ります。</p>
<h2>音声の再起動</h2>
<p>my-readの起動時には音声エンジンを再起動し、古い再生キューを破棄します。</p>
<p><a href="reader-demo.md">テキスト読書のサンプル</a></p>
</body>
</html>
