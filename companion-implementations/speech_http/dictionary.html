<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reader 読み辞書</title><link rel="stylesheet" href="/dictionary.css"><script src="/dictionary.js" defer></script></head>
<body><main>
<header><span class="eyebrow">READER / SPEECH</span><h1>読み辞書</h1>
<p>人名・地名・専門用語を、いつもの読み方に。</p></header>
<section aria-labelledby="form-title"><h2 id="form-title">単語を登録</h2>
<form id="entry-form">
<div class="fields"><label>単語<input id="word" name="word" placeholder="例：重複" maxlength="100" required autocomplete="off"></label>
<label>よみ（ひらがな）<input id="reading" name="reading" placeholder="例：ちょうふく" maxlength="100" required autocomplete="off"></label></div>
<p class="hint">同じ単語を登録すると、読みを更新します。Kyokoの声で確認できます。</p>
<div class="actions"><button type="button" id="preview" class="secondary">読みを試聴</button><button type="submit" id="save">登録する</button></div>
</form><audio id="audio" controls hidden></audio><p id="status" role="status" aria-live="polite"></p>
</section>
<section aria-labelledby="list-title"><div class="list-heading"><h2 id="list-title">登録した単語</h2><span id="count"></span></div>
<label class="search-label">辞書内を検索<input id="search" type="search" placeholder="単語・よみで検索"></label>
<p id="empty">まだ単語が登録されていません。</p><ul id="entries"></ul></section>
<footer>保存した読みは、次に生成する日本語音声から使われます。<br>すでに先読みされた音声には、読み上げを停止して再開すると反映されます。</footer>
</main></body></html>
